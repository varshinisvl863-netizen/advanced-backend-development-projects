<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>API Middleware</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, sans-serif;
}

body{
    background:#f4f4f4;
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;
}

.container{
    width:450px;
    background:#fff;
    padding:30px;
    border-radius:10px;
    box-shadow:0 0 15px rgba(0,0,0,0.2);
}

h2{
    text-align:center;
    margin-bottom:20px;
}

input{
    width:100%;
    padding:12px;
    margin-bottom:15px;
    border:1px solid #ccc;
    border-radius:5px;
}

button{
    width:100%;
    padding:12px;
    background:#6f42c1;
    color:white;
    border:none;
    border-radius:5px;
    cursor:pointer;
}

button:hover{
    background:#5a32a3;
}

#result{
    margin-top:20px;
    padding:15px;
    background:#f8f9fa;
    border-radius:5px;
}
</style>
</head>
<body>

<div class="container">
    <h2>API Middleware Demo</h2>

    <input type="text" id="token" placeholder="Enter API Token">

    <button onclick="callAPI()">Access Protected API</button>

    <div id="result">
        API response will appear here.
    </div>
</div>

<script>
function callAPI(){

    const token = document.getElementById("token").value;

    fetch("http://localhost:3000/api/protected",{
        method:"GET",
        headers:{
            "Authorization":"Bearer " + token,
            "Content-Type":"application/json"
        }
    })
    .then(response => response.json())
    .then(data => {
        document.getElementById("result").innerHTML =
        "<strong>Response:</strong><br>" +
        JSON.stringify(data,null,2);
    })
    .catch(error => {
        document.getElementById("result").innerHTML =
        "Middleware authentication failed.";
    });
}
</script>

</body>
</html>
