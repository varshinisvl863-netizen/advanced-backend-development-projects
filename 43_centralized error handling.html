<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Centralized Error Handling</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, sans-serif;
}

body{
    background:#f4f4f4;
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;
}

.container{
    width:450px;
    background:#fff;
    padding:30px;
    border-radius:10px;
    box-shadow:0 0 15px rgba(0,0,0,0.2);
}

h2{
    text-align:center;
    margin-bottom:20px;
}

input{
    width:100%;
    padding:12px;
    margin-bottom:15px;
    border:1px solid #ccc;
    border-radius:5px;
}

button{
    width:100%;
    padding:12px;
    background:#dc3545;
    color:#fff;
    border:none;
    border-radius:5px;
    cursor:pointer;
}

button:hover{
    background:#c82333;
}

#result{
    margin-top:20px;
    padding:15px;
    background:#f8f9fa;
    border-radius:5px;
    min-height:60px;
}
</style>
</head>
<body>

<div class="container">
    <h2>Centralized Error Handling</h2>

    <input type="text" id="userId" placeholder="Enter User ID">

    <button onclick="fetchUser()">Get User</button>

    <div id="result">
        Response or error message will appear here.
    </div>
</div>

<script>
async function fetchUser(){

    const userId = document.getElementById("userId").value;
    const result = document.getElementById("result");

    try{

        const response = await fetch(
            `http://localhost:3000/api/users/${userId}`
        );

        if(!response.ok){
            throw new Error(
                "Request failed with status: " + response.status
            );
        }

        const data = await response.json();

        result.innerHTML =
            "<strong>User Data:</strong><br>" +
            JSON.stringify(data, null, 2);

    }catch(error){

        result.innerHTML =
            "<strong>Error:</strong><br>" +
            error.message;
    }
}
</script>

</body>
</html>
