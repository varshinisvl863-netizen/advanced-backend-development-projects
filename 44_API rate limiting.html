<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>API Rate Limiting</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, sans-serif;
}

body{
    background:#f4f4f4;
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;
}

.container{
    width:450px;
    background:#fff;
    padding:30px;
    border-radius:10px;
    box-shadow:0 0 15px rgba(0,0,0,0.2);
}

h2{
    text-align:center;
    margin-bottom:20px;
}

input{
    width:100%;
    padding:12px;
    margin-bottom:15px;
    border:1px solid #ccc;
    border-radius:5px;
}

button{
    width:100%;
    padding:12px;
    background:#ff9800;
    color:white;
    border:none;
    border-radius:5px;
    cursor:pointer;
}

button:hover{
    background:#e68900;
}

#result{
    margin-top:20px;
    padding:15px;
    background:#f8f9fa;
    border-radius:5px;
    min-height:60px;
}
</style>
</head>
<body>

<div class="container">
    <h2>API Rate Limiting Demo</h2>

    <input type="text" id="username" placeholder="Enter Username">

    <button onclick="callAPI()">Send Request</button>

    <div id="result">
        API response will appear here.
    </div>
</div>

<script>
async function callAPI(){

    const username = document.getElementById("username").value;

    try{

        const response = await fetch(
            "http://localhost:3000/api/rate-limit",
            {
                method:"POST",
                headers:{
                    "Content-Type":"application/json"
                },
                body:JSON.stringify({
                    username:username
                })
            }
        );

        const data = await response.json();

        if(response.status === 429){
            document.getElementById("result").innerHTML =
                "<strong>Rate Limit Exceeded:</strong><br>" +
                data.message;
        }else{
            document.getElementById("result").innerHTML =
                "<strong>Success:</strong><br>" +
                JSON.stringify(data, null, 2);
        }

    }catch(error){

        document.getElementById("result").innerHTML =
            "<strong>Error:</strong><br>" +
            error.message;
    }
}
</script>

</body>
</html>
